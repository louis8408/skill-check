# SonarCloud. Set sonar.organization / sonar.projectKey to your SonarCloud values
# and add a SONAR_TOKEN secret to the GitHub repository.
sonar.organization=CHANGE_ME
sonar.projectKey=CHANGE_ME_skill-check
sonar.projectName=skill-check
sonar.sources=src
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Process entry point; covered by the end-to-end tests that run it as a child process.
sonar.coverage.exclusions=src/presentation/cli.ts
sonar.qualitygate.wait=true
