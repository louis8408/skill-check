# SonarCloud: https://sonarcloud.io/project/overview?id=louis8408_skill-check
# Analysed by the `sonarcloud` job in .github/workflows/ci.yml (Automatic Analysis is off,
# because it can't import coverage).
sonar.organization=louis8408
sonar.projectKey=louis8408_skill-check
sonar.projectName=skill-check
sonar.sources=src
sonar.tests=tests
# Deliberately broken code that the architecture tests must detect; not real code.
sonar.exclusions=tests/architecture/fixtures/**
sonar.test.exclusions=tests/architecture/fixtures/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Process wiring only (logic is in main.ts); run as a child process by the end-to-end tests.
sonar.coverage.exclusions=src/presentation/cli.ts
sonar.qualitygate.wait=true
