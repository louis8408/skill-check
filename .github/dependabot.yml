version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Type definitions track the oldest supported Node major (see engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript <6.1 only; remove once it supports 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
