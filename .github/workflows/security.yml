name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (Dependabot keeps them current).
jobs:
  # GitHub's static analysis of the TypeScript source; results appear under Security → Code scanning.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript

  # HOL's plugin scanner (manifests, hooks, publishability), run on the marketplace root offline.
  # On pushes to main it also reports the score (no code or file contents) to the HOL Plugins
  # listing, which then shows the result as checked in CI. Reporting never fails the job.
  plugin-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashgraph-online/ai-plugin-scanner-action@9a6d9e4f69118302d3d0b3013ec7a78c1ed52ea9 # v1.2.820
        with:
          plugin_dir: .
          min_score: 80
          fail_on_severity: high
          publish_hint: false
          report_to_hol: ${{ github.event_name == 'push' }}
